name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Android 17 platform (API 37)
        run: |
          # Android 17 的平台包名是 platforms;android-37.0（次要版本命名）
          sdkmanager --install "platforms;android-37.0" "platform-tools" "build-tools;36.0.0"
          echo "--- installed platforms ---"
          ls "$ANDROID_HOME/platforms"

      - name: Install NDK & CMake (native build)
        run: |
          # 显式安装 NDK 与 CMake，避免依赖 runner 预装状态
          sdkmanager --install "ndk;27.3.13750724" "cmake;3.22.1"
          echo "--- ndk ---"
          ls "$ANDROID_HOME/ndk" || true
          echo "--- cmake ---"
          ls "$ANDROID_HOME/cmake" || true

      - name: Point Gradle to NDK
        run: |
          # 把 NDK 绝对路径写入 local.properties / 环境变量，避免 AGP 找不到
          echo "ndk.dir=$ANDROID_HOME/ndk/27.3.13750724" >> local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.3.13750724" >> $GITHUB_ENV
          cat local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.7.1

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk out/ 2>/dev/null || true
          ls -la out || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
          if-no-files-found: warn